# render.yaml — KrishiSetu Nexus Deployment Configuration
# Deploy both Backend API (Web Service) and Frontend (Static Site) on Render

services:
  # ─── 1. Backend Express API ──────────────────────────────────────────────────
  - type: web
    name: krishisetu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      # Set these in Render Dashboard → Environment → krishisetu-api:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      # CORS: Set to your Render static site URL once deployed
      # e.g., https://krishisetu-app.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── 2. Frontend React PWA (Static Site) ────────────────────────────────────
  - type: web
    name: krishisetu-app
    runtime: static
    plan: free
    rootDir: krishisetu-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set these in Render Dashboard → Environment → krishisetu-app:
      # Your krishisetu-api service URL from Render
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_URL
        sync: false
      - key: VITE_DEFAULT_LANGUAGE
        value: kn
      - key: VITE_ENABLE_MOCK_FALLBACK
        value: true
