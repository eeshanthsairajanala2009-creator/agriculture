# render.yaml — KrishiSetu Nexus Deployment Configuration
# HOW TO USE: In Render Dashboard → New → Blueprint Instance → connect this repo
# Render will automatically create both services below from this file.

services:
  # ─── 1. Backend Express API (Node.js Web Service) ────────────────────────────
  - type: web
    name: krishisetu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns PORT automatically — do NOT hardcode it
      - key: HOST
        value: 0.0.0.0
      # ── Set these manually in Render → Environment → krishisetu-api ──────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Set CORS_ORIGIN to your static site URL once deployed
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── 2. Frontend React PWA (Static Site) ─────────────────────────────────────
  - type: static
    name: krishisetu-app
    plan: free
    rootDir: krishisetu-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # ── Set these manually in Render → Environment → krishisetu-app ──────────
      # VITE_API_BASE_URL = https://krishisetu-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PUBLIC_URL
        sync: false
      - key: VITE_DEFAULT_LANGUAGE
        value: kn
      - key: VITE_ENABLE_MOCK_FALLBACK
        value: "true"
